    BANK_TRANSFER: 2
    BILL_PAY: 3
    CASH_IN: 4
    CASH_OUT: 5
    MERCHANT_PAY: 6
    P2P_SEND: 7
  channel:
    AGENT: 1
    API: 2
    APP: 3
    USSD: 4
