# FADE - Docker Compose stack (Phase 0)
#
# Profiles:
#   infra : redpanda (+ topic bootstrap), redis, postgres, prometheus, grafana
#   app   : decision-api (+ migrations), ml-scorer, dashboard
#
# Run everything:  make up        (docker compose --profile infra --profile app up)
# Infra only:      make up-infra
#
# All image tags are pinned; ${VAR:-default} interpolation keeps
# `docker compose config -q` valid without a .env file (CI).

name: fade

networks:
  fade:
    name: fade

volumes:
  pgdata:
  redisdata:
  redpandadata:
  promdata:
  grafana_data:

services:
  # ---------------------------------------------------------------- redpanda
  redpanda:
    image: redpandadata/redpanda:v24.3.4
    restart: unless-stopped
    profiles: [infra]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      # admin API listens on 0.0.0.0:9644 by default (redpanda property)
      - --set
      - redpanda.empty_seed_starts_cluster=true
      - --set
      - redpanda.seed_servers=[]
      - --default-log-level=warn
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v24.3.4
    restart: "no"
    profiles: [infra]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        RP="rpk -X brokers=redpanda:9092"
        $$RP topic create txn.raw --partitions 12 --replicas 1
        $$RP topic create txn.decisions --partitions 12 --replicas 1
        $$RP topic create txn.dead --partitions 3 --replicas 1
        $$RP topic create labels.feedback --partitions 3 --replicas 1
        echo "topics created:"
        $$RP topic list

  # ------------------------------------------------------------------ redis
  redis:
    image: redis:7.4.1-alpine3.20
    restart: unless-stopped
    profiles: [infra]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    # No host port published: `make redis-cli` shells in via `exec`, and the
    # host's 6379 may be occupied by other local projects.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # --------------------------------------------------------------- postgres
  postgres:
    image: postgres:16.6-alpine3.20
    restart: unless-stopped
    profiles: [infra]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fade}
      POSTGRES_USER: ${POSTGRES_USER:-fade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fade} -d ${POSTGRES_DB:-fade}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --------------------------------------------------------------- migrate
  # One-shot: applies ./migrations when postgres is healthy. `up` is
  # idempotent (golang-migrate tracks applied versions).
  migrate:
    image: migrate/migrate:v4.18.1
    restart: "no"
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fade}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fade}?sslmode=disable
    volumes:
      - ../migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /migrate -path /migrations -database "$$DATABASE_URL" up

  # ------------------------------------------------------------ decision-api
  decision-api:
    image: fade-decision-api:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.decision-api
    restart: unless-stopped
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      # Optional so `docker compose config -q` passes in CI without a .env;
      # `make up` always materialises .env from .env.example first.
      - path: ../.env
        required: false
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ------------------------------------------------------------- ml-scorer
  ml-scorer:
    image: fade-ml-scorer:0.1.0
    build:
      context: ..
      dockerfile: ml/serve/Dockerfile
    restart: unless-stopped
    profiles: [app]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # -------------------------------------------------------------- dashboard
  dashboard:
    image: fade-dashboard:0.1.0
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    profiles: [app]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ------------------------------------------------------------- prometheus
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    profiles: [infra]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------- grafana
  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    profiles: [infra]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
