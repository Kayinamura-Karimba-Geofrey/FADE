[project]
name = "fade"
version = "0.1.0"
description = "FADE - Fraud and Anomaly Detection Engine for mobile money"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# Dependency groups (uv-managed). Install with e.g.:
#   uv sync --group generator --group ml --group dev
[dependency-groups]
generator = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "zstandard==0.25.0",
    "python-ulid==4.0.1",
    "pydantic==2.10.6",
    "typer==0.15.1",
    # typer 0.15.x renders help via click's pre-8.2 Parameter.make_metavar API
    "click==8.1.8",
    "pyyaml==6.0.2",
    "confluent-kafka==2.6.1",
]
ml = [
    "scikit-learn==1.6.1",
    "lightgbm==4.6.0",
    "shap==0.47.2",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "optuna==4.2.0",
    "prometheus-client==0.21.1",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "httpx==0.28.1",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.0",
    "types-pyyaml==6.0.12.20250516",
]

[tool.uv]
# Sync every group by default so `uv sync` is all that CI and contributors need.
default-groups = ["generator", "ml", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "dashboard", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as function-call defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["generator", "ml", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
